services:  minio:    container_name: minio_storage    image: minio/minio:latest    ports:      - "9000:9000"      - "9001:9001"    environment:      MINIO_ROOT_USER: root      MINIO_ROOT_PASSWORD: rootpassword      MINIO_CONSOLE_ADDRESS: ":9001"    volumes:      - minio-data:/data    command: server /data --console-address ":9001"  postgres:    container_name: greenhouse_postgres    image: postgres:15-alpine    ports:      - "5432:5432"    environment:      POSTGRES_USER: myuser      POSTGRES_PASSWORD: mypassword      POSTGRES_DB: greenhouse_gases_db    volumes:      - postgres-data:/var/lib/postgresql/data  adminer:    container_name: greenhouse_adminer    image: adminer:latest    ports:      - "8081:8080"    depends_on:      - postgresvolumes:  minio-data:  postgres-data:
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Greenhouse Gases</title>
  <link rel="stylesheet" href="/static/css/static.css">
  <style>
    .auth-wrap{max-width:420px;margin:48px auto;padding:24px;background:#fff;color:#17324d}
    .auth-wrap h1{margin-top:0}.auth-wrap label{display:block;margin:14px 0 6px}
    .auth-wrap input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b8c4ce;font:inherit}
    .auth-wrap button{margin-top:18px;padding:12px 18px;background:#00818F;color:#fff;border:0;cursor:pointer;font:inherit}
    .auth-error{padding:10px;background:#ffe8e8;color:#8a1010}.auth-success{padding:10px;background:#e4f7e9;color:#14532d}
  </style>
</head>
<body>
<main class="auth-wrap">
  <h1>Вход</h1>
  {% if registered %}<p class="auth-success">Регистрация завершена. Теперь войдите.</p>{% endif %}
  {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
  <form method="post" action="/auth/login">
    <label for="username">Имя пользователя</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
  <p>Нет аккаунта? <a href="/auth/register">Зарегистрироваться</a></p>
  <p><a href="/docs">Swagger API</a></p>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Greenhouse Gases</title>
  <link rel="stylesheet" href="/static/css/static.css">
  <style>
    .auth-wrap{max-width:420px;margin:48px auto;padding:24px;background:#fff;color:#17324d}
    .auth-wrap h1{margin-top:0}.auth-wrap label{display:block;margin:14px 0 6px}
    .auth-wrap input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b8c4ce;font:inherit}
    .auth-wrap button{margin-top:18px;padding:12px 18px;background:#00818F;color:#fff;border:0;cursor:pointer;font:inherit}
    .auth-error{padding:10px;background:#ffe8e8;color:#8a1010}
  </style>
</head>
<body>
<main class="auth-wrap">
  <h1>Регистрация</h1>
  {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
  <form method="post" action="/auth/register">
    <label for="username">Имя пользователя (от 3 символов)</label>
    <input id="username" name="username" minlength="3" maxlength="255" pattern="[A-Za-zА-Яа-яЁё0-9_.-]+" autocomplete="username" required>
    <label for="password">Пароль (от 8 символов)</label>
    <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
    <button type="submit">Создать аккаунт</button>
  </form>
  <p>Уже зарегистрированы? <a href="/auth/login">Войти</a></p>
</main>
</body>
</html>

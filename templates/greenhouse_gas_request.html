<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка — Greenhouse Gases</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/static.css') }}">
</head>

<body>

<div class="phone-screen light-screen">

    <header class="page-header">

        <div>
            <div class="page-label">GREENHOUSE GASES</div>
            <h1>Заявка</h1>
        </div>

    </header>

    <main class="add-content">

        <section class="form-section">

            <h2>Медиафайлы</h2>

            <div class="upload-grid">

                <label class="upload-box">

                    <img
                        class="request-upload-media"
                        src="{{ greenhouse_gas.image_url }}"
                        alt="{{ greenhouse_gas.name }}"
                    >

                    <div class="upload-overlay">
                        <span class="upload-icon">▣</span>
                        <span class="upload-text">Добавить изображение</span>
                    </div>

                    <input class="file-input" type="file" accept="image/*">

                </label>

                <label class="upload-box">

                    <video
                        class="request-upload-media"
                        muted
                        loop
                        autoplay
                        playsinline
                        poster="{{ greenhouse_gas.image_url }}"
                    >
                        <source src="{{ greenhouse_gas.video_url }}" type="video/mp4">
                    </video>

                    <div class="upload-overlay">
                        <span class="upload-icon">▶</span>
                        <span class="upload-text">Добавить видео</span>
                    </div>

                    <input class="file-input" type="file" accept="video/*">

                </label>

            </div>

        </section>

        <section class="form-section">

            <h2>Данные для расчёта</h2>

            <label class="field-label" for="name">Название</label>
            <input
                class="field-input"
                id="name"
                type="text"
                value="{{ greenhouse_gas.name }}"
            >

            <label class="field-label" for="formula">Формула</label>
            <input
                class="field-input"
                id="formula"
                type="text"
                value="{{ greenhouse_gas.formula }}"
            >

            <form method="get" action="/greenhouse-gases/request">

                <label class="field-label" for="concentration">
                    Концентрация, ppm
                </label>

                <input
                    class="field-input"
                    id="concentration"
                    name="concentration"
                    type="number"
                    value="{{ concentration }}"
                    min="0.01"
                    step="0.01"
                    required
                >

            </form>

            <label class="field-label" for="gwp">GWP100</label>
            <input
                class="field-input"
                id="gwp"
                type="number"
                value="{{ greenhouse_gas.global_warming_potential_100y }}"
                step="0.01"
            >

            <label class="field-label" for="description">Описание</label>
            <textarea
                class="field-input field-textarea"
                id="description"
                rows="5"
            >{{ greenhouse_gas.description }}</textarea>

        </section>

    </main>

    <nav class="bottom-nav">

        <a href="/greenhouse-gases/1" class="nav-item">
            <span>⌂</span>
            <span>Газ</span>
        </a>

        <a href="/greenhouse-gases/request" class="nav-item active">
            <span>+</span>
            <span>Заявка</span>
        </a>

        <a href="/greenhouse-gases/catalog" class="nav-item">
            <span>▦</span>
            <span>Каталог</span>
        </a>

    </nav>

</div>

</body>
</html>
